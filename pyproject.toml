[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khamsub"
description = "Translate English .srt subtitles into Thai while keeping every timestamp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "melth-cmd" }]
keywords = ["subtitles", "srt", "thai", "translation", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: Thai",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "srt>=3.5.3,<4",
  "charset-normalizer>=3.3",
  "openai>=1.30",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
khamsub = "khamsub.translate:main"

[project.urls]
Homepage = "https://github.com/melth-cmd/khamsub"
Issues = "https://github.com/melth-cmd/khamsub/issues"
Releases = "https://github.com/melth-cmd/khamsub/releases"

[tool.hatch.version]
path = "khamsub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["khamsub"]

[tool.hatch.build.targets.sdist]
include = [
  "/khamsub",
  "/tests",
  "/samples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests cost money and need OPENROUTER_API_KEY; run them explicitly with -m live.
# Packaging tests build and install a wheel; run them with -m packaging.
addopts = "-m 'not live and not packaging'"
markers = [
  "live: talks to the real OpenRouter API and needs OPENROUTER_API_KEY",
  "packaging: builds and installs a wheel; slower and needs the network",
]
